# SQL warehouses this workspace gets. Workspace governance (dbx-governance, config/governance.yml
# estate.<env>.sql_warehouse) reads the information schema through sql-wh-small.
sql_warehouses:
  sql-wh-small:
    cluster_size: Small
    min_num_clusters: 1
    max_num_clusters: 1
    auto_stop_mins: 20
    warehouse_type: PRO
    spot_instance_policy: COST_OPTIMIZED
    tags:
      size: small
      bootstrap: "true"

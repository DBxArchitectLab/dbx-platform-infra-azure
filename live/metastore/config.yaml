# Account-level Unity Catalog metastore (requires Databricks account admin / appropriate Entra role).
# One metastore per region per account. Databricks created this one automatically with the first workspace in
# centralus; the stack adopts it (import_id below) instead of creating a second, which Azure would refuse.
metastore:
  name: "metastore_azure_centralus"
  region: "centralus"
  # Adopt an existing metastore: its ID, from the account console (Catalog > the metastore > Metastore ID).
  # While set, the stack imports that metastore into its state; once imported, the import is a no-op.
  # Remove it (and set name / storage_root) to create a new metastore instead.
  import_id: "e45fc942-890b-4a26-9479-a1b52c18bedc"
  # Optional ADLS Gen2 root (abfss://...). The adopted metastore has none: each environment's catalog brings its own
  # storage from workspace-bootstrap. Only set this when creating a new metastore; changing it replaces the metastore.
  # storage_root: "abfss://dbx@adlsdbxarchitectlab.dfs.core.windows.net/metastore"
  # Off: this is the shared metastore every environment uses, so a destroy must never delete it with its contents.
  force_destroy: false
  # Optional: Unity Catalog owner principal name (e.g. group or user).
  owner: "DBX_Architect_Lab_Admin"
  # Delta Sharing settings, pinned to the adopted metastore's current values so the import changes nothing. The
  # provider requires both or neither. INTERNAL: sharing only within the organization. Token lifetime in seconds;
  # 0 means tokens never expire (the provider default would be 1 year, 31536000).
  delta_sharing_scope: "INTERNAL"
  delta_sharing_recipient_token_lifetime_in_seconds: 0
  # Optional: default data access using Azure Databricks Access Connector (resource ID).
  # access_connector_resource_id: "/subscriptions/.../resourceGroups/.../providers/Microsoft.Databricks/accessConnectors/..."
  data_access_name: "default"
